<div class="container">
  <h2>Update Employee</h2>
  <form [formGroup]="employeeForm" (ngSubmit)="onSubmit()" class="employee-form">
    <div class="form-group my-3">
      <label for="firstName">First Name</label>
      <input type="text" id="firstName" formControlName="firstName" class="form-control">
      <div *ngIf="employeeForm.get('firstName')?.invalid && employeeForm.get('firstName')?.touched" class="error-message text-danger">
        Name is required and must be at least 3 characters long
      </div>
    </div>

    <div class="form-group my-3">
      <label for="lastName">Last Name</label>
      <input type="lastName" id="lastName" formControlName="lastName" class="form-control">
      <div *ngIf="employeeForm.get('lastName')?.invalid && employeeForm.get('lastName')?.touched" class="error-message text-danger">
        Name is required and must be at least 3 characters long
      </div>
    </div>

    <div class="form-group my-3">
      <label for="email">Email</label>
      <input type="email" id="email" formControlName="email" class="form-control">
      <div *ngIf="employeeForm.get('email')?.invalid && employeeForm.get('email')?.touched" class="error-message text-danger">
        Please enter a valid Email
      </div>
    </div>

    <div class="form-group my-3">
      <label for="position">Position</label>
      <input type="position" id="position" formControlName="position" class="form-control">
      <div *ngIf="employeeForm.get('position')?.invalid && employeeForm.get('position')?.touched" class="error-message text-danger">
        position is required and must be at least 3 characters long
      </div>
    </div>
    <div class="form-actions">
      <button type="submit" [disabled]="employeeForm.invalid || loading" class="btn btn-primary me-1">
        {{ loading ? 'Updating...' : 'Update Employee' }}
      </button>
      <button type="button" (click)="onCancel()" class="btn btn-secondary">
        Cancel
      </button>
    </div>
  </form>
</div>
